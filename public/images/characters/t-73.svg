<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1808"/>
      <stop offset="70%" stop-color="#140b04"/>
      <stop offset="100%" stop-color="#050301"/>
    </radialGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" rx="16" fill="url(#bg)"/>
  <rect x="10" y="10" width="380" height="380" rx="12" fill="none" stroke="#FFE600" stroke-width="4"/>

  <!-- Character Badge Frame -->
  <circle cx="200" cy="180" r="110" fill="#0d0702" stroke="#00F5D4" stroke-width="4" filter="url(#neon)"/>

  <!-- Stylized Pixel Art Dig Dug (Taizo Hori) Helmet & Suit -->
  <!-- White Digging Suit Body -->
  <rect x="150" y="190" width="100" height="70" rx="12" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Blue Overalls -->
  <rect x="160" y="210" width="80" height="50" rx="6" fill="#0066cc" stroke="#000000" stroke-width="3"/>

  <!-- Helmet -->
  <circle cx="200" cy="145" r="55" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Red Visor Brim -->
  <rect x="155" y="135" width="90" height="24" rx="6" fill="#ff2a2a" stroke="#000000" stroke-width="3"/>
  <!-- Visor Screen -->
  <rect x="170" y="145" width="60" height="18" rx="4" fill="#FFE600" stroke="#000000" stroke-width="2"/>

  <!-- Harpoon / Pump Tool -->
  <rect x="240" y="170" width="50" height="12" rx="3" fill="#ff9900" stroke="#000000" stroke-width="3"/>
  <polygon points="290,165 315,176 290,187" fill="#ff2a2a" stroke="#000000" stroke-width="2"/>

  <!-- Label text -->
  <rect x="40" y="315" width="320" height="40" rx="6" fill="#000000" stroke="#FFE600" stroke-width="2"/>
  <text x="200" y="341" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#FFE600" text-anchor="middle" letter-spacing="2">TAIZO HORI (DIG DUG)</text>
  <text x="200" y="375" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#00F5D4" text-anchor="middle">SUBTERRANEAN DRILLER // 1982</text>
</svg>