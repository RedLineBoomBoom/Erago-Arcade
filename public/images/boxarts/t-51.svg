<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="50%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A85"/>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="900" fill="url(#bg)"/>

  <!-- CRT Grid Lines -->
  <g opacity="0.15">
    <line x1="0" y1="0" x2="600" y2="0" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="20" x2="600" y2="20" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="40" x2="600" y2="40" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="60" x2="600" y2="60" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="80" x2="600" y2="80" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="100" x2="600" y2="100" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="120" x2="600" y2="120" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="140" x2="600" y2="140" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="160" x2="600" y2="160" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="180" x2="600" y2="180" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="200" x2="600" y2="200" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="220" x2="600" y2="220" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="240" x2="600" y2="240" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="260" x2="600" y2="260" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="280" x2="600" y2="280" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="300" x2="600" y2="300" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="320" x2="600" y2="320" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="340" x2="600" y2="340" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="360" x2="600" y2="360" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="380" x2="600" y2="380" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="400" x2="600" y2="400" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="420" x2="600" y2="420" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="440" x2="600" y2="440" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="460" x2="600" y2="460" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="480" x2="600" y2="480" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="500" x2="600" y2="500" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="520" x2="600" y2="520" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="540" x2="600" y2="540" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="560" x2="600" y2="560" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="580" x2="600" y2="580" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="600" x2="600" y2="600" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="620" x2="600" y2="620" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="640" x2="600" y2="640" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="660" x2="600" y2="660" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="680" x2="600" y2="680" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="700" x2="600" y2="700" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="720" x2="600" y2="720" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="740" x2="600" y2="740" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="760" x2="600" y2="760" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="780" x2="600" y2="780" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="800" x2="600" y2="800" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="820" x2="600" y2="820" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="840" x2="600" y2="840" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="860" x2="600" y2="860" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="880" x2="600" y2="880" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="560" height="860" rx="16" fill="none" stroke="#FF2A85" stroke-width="6"/>
  <rect x="32" y="32" width="536" height="836" rx="12" fill="none" stroke="#000000" stroke-width="4"/>

  <!-- Top Retro Badge Header -->
  <rect x="40" y="50" width="520" height="40" rx="4" fill="#000000" stroke="#FF2A85" stroke-width="2"/>
  <text x="60" y="76" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#FF2A85" letter-spacing="3">AUTHENTIC RETRO ARCHIVE</text>
  <text x="530" y="76" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#FFE600" text-anchor="end">1990</text>

  <!-- Center Graphic Cartridge Area -->
  <rect x="60" y="130" width="480" height="480" rx="12" fill="#050608" stroke="#FF2A85" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Arcade Art Badge Inside -->
  <circle cx="300" cy="350" r="140" fill="none" stroke="#FF2A85" stroke-dasharray="8 6" stroke-width="3"/>
  <circle cx="300" cy="350" r="110" fill="#141724" stroke="#00F5D4" stroke-width="4"/>

  <!-- Retro Icon Glyphs -->
  <polygon points="300,270 330,340 370,350 335,385 345,430 300,400 255,430 265,385 230,350 270,340" fill="#FF2A85" opacity="0.9"/>
  <circle cx="300" cy="350" r="30" fill="#000000"/>
  <text x="300" y="358" font-family="'Courier New', monospace" font-size="24" font-weight="bold" fill="#00F5D4" text-anchor="middle">★</text>

  <!-- Game Title on Box -->
  <rect x="60" y="520" width="480" height="80" rx="6" fill="#000000" opacity="0.85"/>
  <text x="300" y="565" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">F-ZERO</text>
  <text x="300" y="590" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#00F5D4" text-anchor="middle" letter-spacing="1">SUPER FAMICOM 2000CC HIGH SPEED RACER</text>

  <!-- Bottom Details -->
  <rect x="60" y="650" width="480" height="190" rx="8" fill="#0d0e14" stroke="#222538" stroke-width="2"/>
  <text x="90" y="695" font-family="'Courier New', monospace" font-size="16" fill="#8892b0">PUBLISHER / DEV:</text>
  <text x="510" y="695" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="end">Nintendo EAD</text>
  
  <line x1="90" y1="715" x2="510" y2="715" stroke="#222538" stroke-width="1"/>

  <text x="90" y="745" font-family="'Courier New', monospace" font-size="16" fill="#8892b0">MEDIA CLASSIFICATION:</text>
  <text x="510" y="745" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#FFE600" text-anchor="end">ORIGINAL MASTER ROM</text>

  <line x1="90" y1="765" x2="510" y2="765" stroke="#222538" stroke-width="1"/>

  <text x="90" y="795" font-family="'Courier New', monospace" font-size="16" fill="#8892b0">PRESERVATION STATUS:</text>
  <text x="510" y="795" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#00F5D4" text-anchor="end">VERIFIED 100% AUTHENTIC</text>

  <!-- Official Seal -->
  <circle cx="500" cy="850" r="32" fill="#FF2A85" stroke="#000000" stroke-width="3"/>
  <text x="500" y="848" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#000000" text-anchor="middle">ORIGINAL</text>
  <text x="500" y="860" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#000000" text-anchor="middle">ARCADE</text>
</svg>